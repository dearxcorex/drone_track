[project]
name = "drone-detector"
version = "0.1.0"
description = "DJI DroneID decoder for NBTC Thailand. Decodes DJI's WiFi beacon vendor IE into drone GPS, pilot GPS, serial, and flight session UUID."
readme = "README.md"
authors = [
    { name = "dearxcorex", email = "deardevx@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
    "scapy>=2.7.0",
    "typer>=0.25.1",
]

[project.scripts]
drone-detector = "drone_detector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "live: requires a real monitor-mode WiFi interface (Linux only)",
]

[tool.coverage.run]
source = ["src/drone_detector"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true   # scapy has no stubs
